name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          # v1.2.3 tag -> 1.2.3.0; otherwise the version in build.yaml
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && v="$v.0"
          else
            v=$(sed -n 's/^version: "\(.*\)"/\1/p' build.yaml)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          v=${{ steps.version.outputs.version }}
          dotnet build Jellyfin.Plugin.QuickTag -c Release -p:Version=$v -p:AssemblyVersion=$v -p:FileVersion=$v

      - name: Package
        id: package
        run: |
          zip="dist/quicktag_${{ steps.version.outputs.version }}.zip"
          mkdir -p dist
          zip -j "$zip" Jellyfin.Plugin.QuickTag/bin/Release/net10.0/Jellyfin.Plugin.QuickTag.dll
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Manifest
        # Jellyfin plugin repository file for this release only, so the repository URL
        # .../releases/download/<tag>/manifest.json always offers exactly this version
        run: |
          zip="${{ steps.package.outputs.zip }}"
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$zip")" \
            --arg md5 "${{ steps.package.outputs.md5 }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg tag "$GITHUB_REF_NAME" \
            '[{
              guid: "1746460b-89cc-4a19-869e-82e4ea79f6fd",
              name: "QuickTag",
              overview: "Add and remove tags on many titles quickly",
              description: "Adds a Tag mode to the web client: pick or create a tag, then click titles to add or remove it. Needs the File Transformation plugin.",
              owner: "mikebean233",
              category: "General",
              versions: [{
                version: $version, changelog: ("Release " + $tag), targetAbi: "12.4.0.0",
                sourceUrl: $url, checksum: $md5, timestamp: $ts
              }]
            }]' > dist/manifest.json
          cat dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: quicktag
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" dist/manifest.json \
            --title "$GITHUB_REF_NAME" --notes "Jellyfin repository (this version only): https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/manifest.json · md5 ${{ steps.package.outputs.md5 }} · sha256 ${{ steps.package.outputs.sha256 }}"
